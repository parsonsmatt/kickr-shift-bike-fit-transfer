<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>model tests</title></head>
<body>
<pre id="results">running</pre>
<script type="module">
// Numerical tests for the maths, with no DOM involved: frame geometry, the stem solver,
// and the reverse solve. These check invariants and round trips rather than
// hard-coded outputs, so they stay meaningful if a constant changes.
import { state, adoptState, defaultState } from '../js/state.js';
import { createFrame, barClampPosition, railClampPosition, steererUp, asBuiltPositions,
         spacerRoom, asBuiltOverflowsSteerer } from '../js/model/frame.js';
import { carriagePosition, carriageReadings, targetPositions, standoverOffsetFor, saddleOffsetFor,
         barOffsetFor, barClampOffset, standoverTravelFor, scaleLimit, readingOnScale } from '../js/model/fit-bike.js';
import { trainerSetups, lowestStandoverSetup } from '../js/model/reverse.js';
import { standoverOffset, STANDOVER_POSITIONS } from '../js/model/standover.js';
import { stemSolutions, bestStemSolution, saddleSetup, targetBarClamp, targetRailClamp, fitSpacerHeight, needsNegativeSpacers } from '../js/model/solver.js';

const log = [];
let failures = 0;
function check(label, condition) {
  const ok = condition === true;
  if (!ok) failures++;
  log.push(`${ok ? 'ok  ' : 'FAIL'} ${label}`);
}
function near(label, got, want, tolerance = 1e-6) {
  const ok = Math.abs(got - want) < tolerance;
  if (!ok) failures++;
  log.push(`${ok ? 'ok  ' : 'FAIL'} ${label}${ok ? '' : `  got=${got} want=${want}`}`);
}
const note = (label, value) => log.push(`--   ${label} = ${JSON.stringify(value)}`);

/** Fresh state, with the two carriages and readings under the test's control. */
function reset() {
  adoptState(defaultState());
  state.readings = { standover: 'A', saddleHeight: 0, saddleForeAft: 0, barHeight: 0, barReach: 0 };
}
/** Set a carriage up so that zero readings put its *target point* on `point`. */
function aimCarriageAt(name, point) {
  state.carriages[name] = { zeroX: point[0], zeroY: point[1], mastAngle: 90,
    mastMmPerUnit: 10, slideTilt: 0, slideMmPerUnit: 10 };
  // The bar carriage does not locate the bar clamp — the fit bike's own front end stands above
  // and ahead of it — so back its zero off by that. Computed after the assignment above, since
  // the front end is measured off this carriage's mast angle.
  if (name === 'bar') {
    const front = barClampOffset();
    state.carriages.bar.zeroX -= front[0];
    state.carriages.bar.zeroY -= front[1];
  }
}

/** The front end worked out by hand, to check the model's own against. */
function frontEndByHand(length, angle, stemHeight) {
  const column = state.carriages.bar.mastAngle * Math.PI / 180;
  const bearing = (90 - state.carriages.bar.mastAngle + angle) * Math.PI / 180;
  return [
    (stemHeight / 2) * -Math.cos(column) + length * Math.cos(bearing),
    (stemHeight / 2) * Math.sin(column) + length * Math.sin(bearing),
  ];
}

try {

/* ================ 1. standover is a vector, not a lift ================ */
log.push('== standover');
reset();
near('position A does not move anything', standoverOffsetFor('A')[0], 0);
near('A travel is zero', standoverTravelFor('A'), 0);
near('D travels 3 letters worth', standoverTravelFor('D'), 60);
near('H travels 7 letters worth', standoverTravelFor('H'), 140);

// 20mm per letter along an axis 4 degrees back from vertical.
const perLetter = standoverOffsetFor('B');
near('one letter rises 19.95mm', perLetter[1], 20 * Math.cos(4 * Math.PI / 180), 1e-9);
near('one letter goes 1.40mm back', perLetter[0], -20 * Math.sin(4 * Math.PI / 180), 1e-9);
const toH = standoverOffsetFor('H');
near('A to H rises 139.7mm', toH[1], 139.66, 0.01);
near('A to H goes 9.8mm back', -toH[0], 9.77, 0.01);
check('the rearward part exceeds the match tolerance at H', -toH[0] > state.options.toleranceMm);

// The offset must move BOTH carriages, and move them equally.
state.readings.standover = 'H';
const atH = targetPositions();
state.readings.standover = 'A';
const atA = targetPositions();
near('saddle moved back with the rise', atH.saddle[0] - atA.saddle[0], toH[0], 1e-9);
near('bar moved back with the rise', atH.bar[0] - atA.bar[0], toH[0], 1e-9);
near('saddle rose with the rise', atH.saddle[1] - atA.saddle[1], toH[1], 1e-9);
near('bar rose with the rise', atH.bar[1] - atA.bar[1], toH[1], 1e-9);

// A vertical axis is the degenerate case, and must be exactly vertical.
near('a 0 degree lean has no rearward part', standoverOffset('H', 20, 0)[0], 0, 1e-12);
near('a 0 degree lean rises the full travel', standoverOffset('H', 20, 0)[1], 140, 1e-12);

/* ================ 1b. the fit bike has a front end of its own ================ */
// The bar carriage's zero is measured to the column, at the top of the clamp the stem sits on.
// The bar clamp is half a stem height up the column from there and then a stem length forward,
// and leaving all of that out made every frame's stem answer short by about a stem length.
log.push('== fit bike front end');
reset();
const wholeFrontEnd = frontEndByHand(90, -7, 40);
near('the model agrees with the arithmetic, forward', barClampOffset()[0], wholeFrontEnd[0], 1e-9);
near('and up', barClampOffset()[1], wholeFrontEnd[1], 1e-9);
note('stock front end', barClampOffset().map(v => Math.round(v * 10) / 10));
check('the stock front end is worth most of a stem length forward', barClampOffset()[0] > 80);
check('and a good 30mm up', barClampOffset()[1] > 28);

const withFrontEnd = targetPositions().bar;
state.fitBike.stemLength = 0;
state.fitBike.stemHeight = 0;
const atTheCarriage = targetPositions().bar;
near('the target moves with it, forward', withFrontEnd[0] - atTheCarriage[0], wholeFrontEnd[0], 1e-9);
near('and up', withFrontEnd[1] - atTheCarriage[1], wholeFrontEnd[1], 1e-9);

// The two moves are separable, and the first one is up the column - so it goes back a little
// as well as up, exactly as spacers do on a frame.
reset();
state.fitBike.stemLength = 0;
const columnOnly = barClampOffset();
near('half the stem height up a 76 degree column', Math.hypot(columnOnly[0], columnOnly[1]), 20, 1e-9);
check('which is up and back, not straight up', columnOnly[0] < 0 && columnOnly[1] > 19);
near('along the column axis exactly',
  columnOnly[0] / columnOnly[1], steererUp(state.carriages.bar.mastAngle)[0] / steererUp(state.carriages.bar.mastAngle)[1], 1e-9);

// The angle convention is the frame's: off perpendicular to the column, not off horizontal.
reset();
state.fitBike.stemHeight = 0;
state.fitBike.stemLength = 100;
state.fitBike.stemAngle = 0;
near('a 0 degree stem rises on a column leaning 14 degrees off vertical',
  barClampOffset()[1], 100 * Math.sin(14 * Math.PI / 180), 1e-9);
state.carriages.bar.mastAngle = 90;
near('and is exactly level on a vertical column', barClampOffset()[1], 0, 1e-9);
near('with its whole length forward', barClampOffset()[0], 100, 1e-9);
state.fitBike.stemAngle = 90;
near('straight up is straight up', barClampOffset()[1], 100, 1e-9);
near('and nothing forward', barClampOffset()[0], 0, 1e-12);

// It has to live in the offset both directions take, or the reverse solve would hand back
// readings that do not reproduce the position it was given.
reset();
const wantedPoint = [420, 620];
const inverted = carriageReadings(state.carriages.bar, wantedPoint, barOffsetFor('E'));
const backAgain = carriagePosition(state.carriages.bar, inverted.mastReading, inverted.slideReading, barOffsetFor('E'));
near('the bar offset inverts exactly in x', backAgain[0], wantedPoint[0], 1e-9);
near('and in y', backAgain[1], wantedPoint[1], 1e-9);
check('the front end is part of that offset, not just the standover rise',
      barOffsetFor('E')[0] - standoverOffsetFor('E')[0] > 80 &&
      barOffsetFor('E')[1] - standoverOffsetFor('E')[1] > 28);

/* ================ 2. the stem solver hits a reachable target exactly ================ */
log.push('== stem solver');
reset();
const frame = createFrame('Round Trip', '56');
Object.assign(frame, { stack: 570, reach: 385, headTubeAngle: 72.5, seatTubeAngle: 73.5,
  headsetStack: 15, stemClampHeight: 40, exposedSteerer: 80 });

// Build a target that a catalogue stem can reach exactly: 100mm, -6 deg, 25mm of spacers
// (25 is a whole number of 2.5mm spacers).
const buildable = barClampPosition(frame, 25, 100, -6);
aimCarriageAt('bar', buildable);

const best = bestStemSolution(frame);
near('recovers the stem length', best.stemLength, 100);
near('recovers the stem angle', best.stemAngle, -6);
near('recovers the spacer stack', best.spacerHeight, 25, 1e-9);
near('lands on the target', best.missMm, 0, 1e-9);
check('and is marked reachable', best.reachable === true);
check('with no warnings', best.warnings.length === 0);

// The steerer limit is measured as exposed steerer, and the stem's clamp comes out of it.
// 80mm of steerer less a 40mm clamp leaves 40mm of spacers, which the 25mm answer fits in.
near('spacer room is the exposed steerer less the stem clamp', spacerRoom(frame), 40, 1e-12);
frame.exposedSteerer = 60;
// Not via the best solution: with only 20mm of room the ranking moves on to a combination
// that does fit, which is the right behaviour but says nothing about the limit. Ask the
// 100mm/-6 answer itself, the one that needs 25mm.
const cramped = stemSolutions(frame).find(s => s.stemLength === 100 && s.stemAngle === -6);
check('a shorter steerer rules that answer out', cramped.reachable === false);
check('and says what the limit is', cramped.warnings.some(w => /over spacer limit \(20mm\)/.test(w)));
check('while the ranking falls back to something that fits', bestStemSolution(frame).reachable === true);
check('as-built 25mm spacers do not fit under a 60mm steerer with a 40mm clamp',
      asBuiltOverflowsSteerer({ ...frame, builtSpacerHeight: 25 }) === true);
check('but they do under 80mm',
      asBuiltOverflowsSteerer({ ...frame, exposedSteerer: 80, builtSpacerHeight: 25 }) === false);
check('exactly filling the steerer still counts as fitting',
      asBuiltOverflowsSteerer({ ...frame, exposedSteerer: 65, builtSpacerHeight: 25 }) === false);
frame.exposedSteerer = 80;

// Every solution's dx/dy must agree with its own miss distance.
const allAgree = stemSolutions(frame).every(s =>
  Math.abs(Math.hypot(s.dx, s.dy) - s.missMm) < 1e-9);
check('miss distance always equals hypot(dx, dy)', allAgree);

// Ranking: reachable first, then by miss.
const ranked = stemSolutions(frame);
const firstUnreachable = ranked.findIndex(s => !s.reachable);
check('reachable solutions all sort ahead of unreachable ones',
  firstUnreachable === -1 || ranked.slice(firstUnreachable).every(s => !s.reachable));
check('reachable solutions are ordered by miss',
  ranked.filter(s => s.reachable).every((s, i, arr) => i === 0 || arr[i - 1].missMm <= s.missMm + 1e-12));

// Spacers are quantised, never negative, and a too-tall front end is flagged.
reset();
aimCarriageAt('bar', barClampPosition(frame, 0, 100, -6));
const wantsNegative = fitSpacerHeight(frame, 100, -17, [buildable[0], buildable[1] - 200]);
check('a target below the stem needs negative spacers', wantsNegative.exactSpacerHeight < -0.5);
near('but the spacer stack is clamped at zero', Math.min(0, wantsNegative.spacerHeight), 0);
const quantised = stemSolutions(frame).every(s =>
  Math.abs(s.spacerHeight / state.options.spacerStep - Math.round(s.spacerHeight / state.options.spacerStep)) < 1e-9);
check('every spacer stack is a whole number of spacers', quantised);

// The model keeps the impossible options — the UI is what hides them — so both flips of an
// angle must still be generated here, and needsNegativeSpacers must be what picks them out.
state.options.stemLengths = '100';
state.options.stemAngles = '6';
const bothFlips = stemSolutions(frame);
check('each angle is tried both ways up', bothFlips.length === 2);
check('and the two flips are +6 and -6',
  bothFlips.map(s => s.stemAngle).sort((a, b) => a - b).join(',') === '-6,6');
check('needsNegativeSpacers agrees with the spacer figure it would need',
  bothFlips.every(s => needsNegativeSpacers(s) === (s.exactSpacerHeight < -0.5)));
check('and never fires on a solution marked reachable',
  bothFlips.every(s => !(s.reachable && needsNegativeSpacers(s))));

// Spacers move the bar up the steerer, so more spacers must mean a higher bar.
const low = barClampPosition(frame, 10, 100, -6);
const high = barClampPosition(frame, 30, 100, -6);
check('more spacers raises the bar', high[1] > low[1]);
check('and brings it back, along the steerer', high[0] < low[0]);
near('the bar moves exactly along the steerer axis',
  (high[0] - low[0]) / (high[1] - low[1]), steererUp(frame.headTubeAngle)[0] / steererUp(frame.headTubeAngle)[1], 1e-9);

/* ================ 3. saddle round trip ================ */
log.push('== saddle');
reset();
const SADDLE_HEIGHT = 700;
state.fitBike.railsBelowSaddleTop = 50;
frame.crankLength = state.fitBike.crankLength; // no crank compensation for this check
const clamp = railClampPosition({ seatTubeAngle: frame.seatTubeAngle, saddleHeight: SADDLE_HEIGHT,
  seatpostSetback: 0, railOffset: 0, railsBelowSaddleTop: state.fitBike.railsBelowSaddleTop });
aimCarriageAt('saddle', clamp);
frame.seatpostSetback = 0;

const saddle = saddleSetup(frame);
near('reports back the saddle height it was built from', saddle.heightAlongSeatAxis, SADDLE_HEIGHT, 1e-9);
near('a clamp on the seat axis needs no setback', saddle.clampBehindAxis, 0, 1e-9);
near('and no rail offset', saddle.railOffset, 0, 1e-9);
check('so the saddle is reachable', saddle.railOffsetReachable === true);

// The same position on a steeper seat angle reads as a different saddle height.
const steeper = { ...frame, seatTubeAngle: 76 };
check('a steeper seat angle changes the reported height',
  Math.abs(saddleSetup(steeper).heightAlongSeatAxis - SADDLE_HEIGHT) > 1);
note('same position, 73.5 vs 76 deg seat angle',
  [saddle.heightAlongSeatAxis.toFixed(1), saddleSetup(steeper).heightAlongSeatAxis.toFixed(1)]);

// A seatpost with setback absorbs the rail offset one-for-one.
const withPost = { ...frame, seatpostSetback: 15 };
near('post setback comes straight off the rail offset',
  saddleSetup(withPost).railOffset, saddle.railOffset - 15, 1e-9);
// Rail travel is a limit, not a suggestion.
check('an impossible rail offset is flagged',
  saddleSetup({ ...frame, seatpostSetback: -80, railTravel: 25 }).railOffsetReachable === false);

/* ================ 4. crank and bar-reach compensation ================ */
log.push('== compensation');
reset();
aimCarriageAt('saddle', [-150, 620]);
aimCarriageAt('bar', [380, 600]);
state.fitBike.crankLength = 170;

near('a longer crank lowers the saddle by the difference',
  targetRailClamp({ ...frame, crankLength: 175 })[1], targetRailClamp({ ...frame, crankLength: 170 })[1] - 5, 1e-9);
near('a shorter crank raises it',
  targetRailClamp({ ...frame, crankLength: 165 })[1], targetRailClamp({ ...frame, crankLength: 170 })[1] + 5, 1e-9);

state.fitBike.matchMode = 'clamp';
const clampModeTarget = targetBarClamp({ ...frame, barReach: 95 });
state.fitBike.matchMode = 'hoods';
state.fitBike.barReach = 75;
near('clamp mode ignores the bar reach', clampModeTarget[0], targetBarClamp({ ...frame, barReach: 75 })[0], 1e-9);
near('hood mode pulls a longer-reach bar back by the difference',
  targetBarClamp({ ...frame, barReach: 95 })[0], clampModeTarget[0] - 20, 1e-9);

/* ======= 4b. where the saddle sits on the fit bike's own rails ======= */
log.push('== saddle on its rails');
reset();
state.readings = { standover: 'A', saddleHeight: 15, saddleForeAft: 7, barHeight: 6, barReach: 12 };

// The carriage locates the clamp; what has to be reproduced is where the saddle ends up. Slide
// the saddle back on the rails and the saddle target goes back with it, one for one.
state.fitBike.saddleRailOffset = 0;
const centred = targetPositions();
state.fitBike.saddleRailOffset = 20;
const slidBack = targetPositions();
near('sliding the saddle back moves the saddle target back by the same amount',
     centred.saddle[0] - slidBack.saddle[0], 20, 1e-9);
near('and does not move it up or down', slidBack.saddle[1], centred.saddle[1], 1e-12);
near('and leaves the bar target where it was', slidBack.bar[0], centred.bar[0], 1e-12);
check('the offset rides on the saddle carriage, not the standover rise',
      Math.abs(saddleOffsetFor('A')[0] - standoverOffsetFor('A')[0] + 20) < 1e-12);
near('a negative value means slid forward', (state.fitBike.saddleRailOffset = -15, targetPositions().saddle[0]),
     centred.saddle[0] + 15, 1e-9);

// It has to come out of the frame's own rail offset at full size: both figures are measured
// from the same saddle's rail centre, so 20mm back on the fit bike is 20mm back on the frame.
reset();
const railed = createFrame('Railed', '56');
state.frames = [railed];
state.readings = { standover: 'A', saddleHeight: 15, saddleForeAft: 7, barHeight: 6, barReach: 12 };
state.fitBike.saddleRailOffset = 0;
const offsetCentred = saddleSetup(railed).railOffset;
state.fitBike.saddleRailOffset = 20;
near('20mm back on the fit bike is 20mm back on the frame',
     saddleSetup(railed).railOffset - offsetCentred, 20, 1e-9);
state.fitBike.saddleRailOffset = 0;

/* ================ 5. reverse: a real bike back to fit bike readings ================ */
// The strong claim: type the readings this produces into section 1 and the target lands
// back on the as-built position. Checked against the machine's measured constants, not a
// contrived pair, so a sign error in either direction shows up.
reset();
const ridden = createFrame('Ridden', '56');
Object.assign(ridden, {
  stack: 570, reach: 385, headTubeAngle: 72.5, seatTubeAngle: 73.5,
  headsetStack: 15, stemClampHeight: 40, seatpostSetback: 20,
  builtStemLength: 100, builtStemAngle: -6, builtSpacerHeight: 25,
  builtSaddleHeight: 720, builtRailOffset: 5,
});
state.frames = [ridden];
// Deliberately not zero: the saddle rail offset has to be inverted along with everything else,
// and a direction sign error there would cancel out at 0.
state.fitBike.saddleRailOffset = 18;

// The real machine's two mast maximums are measured, and this block is about what happens
// with and without them, so start from unmeasured and put each one in deliberately.
state.carriages.saddle.mastMaxReading = 0;
state.carriages.bar.mastMaxReading = 0;

const built = asBuiltPositions(ridden, state.fitBike.railsBelowSaddleTop);
const setups = trainerSetups(ridden);
check('one row per standover position', setups.length === STANDOVER_POSITIONS.length);

for (const setup of setups) {
  state.readings = { ...setup };
  const back = targetPositions();
  near(`standover ${setup.standover} reproduces the saddle clamp`,
       Math.hypot(back.saddle[0] - built.saddle[0], back.saddle[1] - built.saddle[1]), 0);
  near(`standover ${setup.standover} reproduces the bar clamp`,
       Math.hypot(back.bar[0] - built.bar[0], back.bar[1] - built.bar[1]), 0);
}

// Every position is an exact answer, so they must differ — otherwise the standover offset
// is not reaching the inverse at all.
check('the readings differ between standover positions',
      Math.abs(setups[0].saddleHeight - setups[7].saddleHeight) > 1);
// Higher standover raises both carriages, so less mast reading is needed to reach the
// same point.
check('a higher standover position needs a smaller height reading',
      setups[7].saddleHeight < setups[0].saddleHeight && setups[7].barHeight < setups[0].barHeight);
note('A readings', ['saddleHeight', 'saddleForeAft', 'barHeight', 'barReach'].map(k => Number(setups[0][k].toFixed(2))));
note('on scale', setups.filter(s => s.onScale).map(s => s.standover));

// Unmeasured maximums mean the only test is "no reading below zero".
check('with no maximums measured, onScale is exactly "no reading below zero"',
      setups.every(s => s.onScale === ['saddleHeight', 'saddleForeAft', 'barHeight', 'barReach'].every(k => s[k] >= 0)));

// Measuring the top of a scale's travel is what rules out the LOW letters, and that is what
// makes "the lowest position that fits" a real choice rather than always A.
const unlimited = lowestStandoverSetup(ridden);
check('with no maximums measured the lowest that fits is A', unlimited.standover === 'A');

state.carriages.saddle.mastMaxReading = unlimited.saddleHeight - 2;
const limited = trainerSetups(ridden);
check('a measured maximum rules the low positions out', limited[0].onScale === false);
check('and names the scale responsible', limited[0].offScale.join(',') === 'saddleHeight');
const nowLowest = lowestStandoverSetup(ridden);
check('so the lowest that fits moves up the alphabet', nowLowest && nowLowest.standover !== 'A');
check('and the chosen row really is on the scales', nowLowest.onScale === true);
check('and it is the first such row', limited.findIndex(s => s.onScale) === STANDOVER_POSITIONS.indexOf(nowLowest.standover));
note('lowest that fits, saddle scale capped', nowLowest.standover);

// A limit small enough to rule out every position must return nothing rather than a row
// that does not fit.
state.carriages.saddle.mastMaxReading = 0.0001;
check('no position fitting returns null, not a bad row', lowestStandoverSetup(ridden) === null);

// 0 has to mean "not measured" — read as a real limit it would rule out everything.
state.carriages.saddle.mastMaxReading = 0;
check('a maximum of 0 means unmeasured, not a zero-length scale',
      scaleLimit(state.carriages.saddle, 'mast') === null);
check('so every position is back on the scales', lowestStandoverSetup(ridden).standover === 'A');
check('readingOnScale still refuses a negative reading',
      readingOnScale(state.carriages.saddle, 'mast', -0.1) === false);
state.carriages.saddle.mastMaxReading = 20;
check('and refuses one past a measured maximum',
      readingOnScale(state.carriages.saddle, 'mast', 20.1) === false);
check('but accepts the maximum itself',
      readingOnScale(state.carriages.saddle, 'mast', 20) === true);

// With the machine's own measured maximums in place, the 70mm handlebar scale is what does
// the ruling out: at position A the bar cannot get high enough for an ordinary frame, so the
// standover rise is doing real work rather than the choice always landing on A.
reset();
state.frames = [ridden];
const asMeasured = trainerSetups(ridden);
check('the measured handlebar travel rules position A out', asMeasured[0].onScale === false);
check('and names the handlebar scale as the reason', asMeasured[0].offScale.includes('barHeight'));
check('so the lowest that fits is not A', lowestStandoverSetup(ridden).standover !== 'A');
note('on scale with the measured maximums', asMeasured.filter(s => s.onScale).map(s => s.standover));

// The inverse of a carriage is the inverse of the forward model for arbitrary points too.
reset();
const spot = [123, 456];
const roundTripped = carriageReadings(state.carriages.bar, spot, [7, 11]);
const backToSpot = carriagePosition(state.carriages.bar, roundTripped.mastReading, roundTripped.slideReading, [7, 11]);
near('carriageReadings inverts carriagePosition in x', backToSpot[0], spot[0]);
near('carriageReadings inverts carriagePosition in y', backToSpot[1], spot[1]);
check('a carriage with a dead slide cannot be inverted',
      carriageReadings({ ...state.carriages.bar, slideMmPerUnit: 0 }, spot) === null);

} catch (error) {
  failures++;
  log.push('THREW ' + (error && error.stack ? error.stack : error));
}

document.querySelector('#results').textContent =
  `${failures} failures\n` + log.join('\n');
</script>
</body></html>
